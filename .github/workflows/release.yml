# A tag vX.Y.Z builds the Windows installer and portable zip, the macOS disk image (one universal
# app for Apple silicon and Intel, not signed by a Developer ID), the Linux .deb, .rpm and AppImage,
# and the meownitor-round skill, and publishes them as the GitHub release of that tag, with the
# version's section of CHANGELOG.md as its notes. The tag has to match the version in
# app/src-tauri/tauri.conf.json. Run by hand with "publish" off, it builds any branch or tag and only
# leaves the packages as the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)build, e.g. v0.2.0 (with publish off: any branch or tag)"
        required: true
      publish:
        description: "Publish the release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag against the app's version
        id: check
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:PUBLISH -eq 'true' -and "v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match tauri.conf.json version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked -- --test-threads=1

      # The hook is a second binary of the same crate; it is built first so the installer can take it
      # as a resource (tauri.bundle.windows.conf.json) and install it next to the widget.
      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin meownitor-hook
          npx tauri build --bundles nsis --config src-tauri/tauri.bundle.windows.conf.json

      - name: Check the installer holds both programs
        shell: pwsh
        run: |
          $setup = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $list = 7z l $setup.FullName | Out-String
          foreach ($exe in "meownitor.exe", "meownitor-hook.exe") {
            if ($list -notmatch [regex]::Escape($exe)) { throw "$exe is missing from $($setup.Name)" }
          }

      - name: Package
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force dist
          $rel = "app/src-tauri/target/release"
          $setup = Get-ChildItem "$rel/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "$out/Meownitor_${env:VERSION}_x64-setup.exe"

          $portable = New-Item -ItemType Directory -Force "portable/Meownitor"
          Copy-Item "$rel/meownitor.exe", "$rel/meownitor-hook.exe", README.md, LICENSE $portable
          Compress-Archive -Path "portable/Meownitor" -DestinationPath "$out/Meownitor_${env:VERSION}_x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked -- --test-threads=1

      # The bundle carries every binary of the crate next to the widget (Contents/MacOS), but for a
      # universal app tauri joins only the widget's two builds: the hook's are joined here, where
      # it looks for them, and signed ad hoc so the app's own (ad hoc) signature can seal it in.
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin meownitor-hook --target $t
          done
          u=src-tauri/target/universal-apple-darwin/release
          mkdir -p $u
          lipo -create -output $u/meownitor-hook \
            src-tauri/target/aarch64-apple-darwin/release/meownitor-hook \
            src-tauri/target/x86_64-apple-darwin/release/meownitor-hook
          codesign --force --sign - $u/meownitor-hook
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Check the app holds both programs, for both architectures, sealed
        run: |
          app=$(ls -d app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          ls -l "$app/Contents/MacOS"
          for f in "$app"/Contents/MacOS/*; do
            echo "$(basename "$f"): $(lipo -archs "$f")"
            lipo -archs "$f" | grep -q arm64 && lipo -archs "$f" | grep -q x86_64
          done
          test -x "$app/Contents/MacOS/meownitor-hook"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package
        run: |
          mkdir -p dist
          cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/Meownitor_${VERSION}_universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  # On the oldest supported Ubuntu, so the packages run on systems with an older glibc too.
  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked -- --test-threads=1

      # As on Windows, the hook first; the packages carry it in /usr/bin next to the widget.
      - name: Build the packages
        working-directory: app
        run: |
          npm ci
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin meownitor-hook
          npx tauri build --bundles deb,rpm,appimage

      - name: Check the packages hold both programs
        run: |
          b=app/src-tauri/target/release/bundle
          dpkg -c $b/deb/*.deb | tee /dev/stderr | grep -qE ' (\./)?usr/bin/meownitor-hook$'
          rpm -qlp $b/rpm/*.rpm | tee /dev/stderr | grep -qx '/usr/bin/meownitor-hook'
          img=$(ls $b/appimage/*.AppImage)
          chmod +x "$img"
          (cd "$RUNNER_TEMP" && "$OLDPWD/$img" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/meownitor-hook"

      - name: Package
        run: |
          mkdir -p dist
          b=app/src-tauri/target/release/bundle
          cp $b/deb/*.deb "dist/Meownitor_${VERSION}_amd64.deb"
          cp $b/rpm/*.rpm "dist/Meownitor_${VERSION}_x86_64.rpm"
          cp $b/appimage/*.AppImage "dist/Meownitor_${VERSION}_amd64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  publish:
    needs: [windows, macos, linux]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: The skill and the checksums
        run: |
          (cd skill && zip -qr ../dist/meownitor-round-skill.zip meownitor-round)
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt dist/
          cat dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          # The version's section of CHANGELOG.md: from its "## <version>" heading to the next "## ".
          $version = $env:TAG -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[?$([regex]::Escape($version))\]?(\s|$)").LineNumber
          $notes = if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else { @("Release $env:TAG") }
          $notes | Set-Content notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:TAG -like '*-*') { '--prerelease' } else { $null }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG (Get-ChildItem dist).FullName --clobber
          } else {
            gh release create $env:TAG (Get-ChildItem dist).FullName --title $env:TAG --notes-file notes.md $pre
          }
