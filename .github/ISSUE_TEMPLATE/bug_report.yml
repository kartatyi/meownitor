name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the card
        2. ...
  - type: input
    id: version
    attributes:
      label: Meownitor version
      description: The last line on the back of the card, e.g. "Meownitor 0.1.0".
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The system and its version; on Linux also the desktop and whether it is Wayland or X11.
      placeholder: Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04, GNOME, Wayland
  - type: dropdown
    id: where
    attributes:
      label: Where the sessions run
      multiple: true
      options:
        - Claude Code in a terminal
        - Claude Desktop
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The end of `~/.meownitor/widget.log` (`%USERPROFILE%\.meownitor\widget.log` on Windows), and `events.log` if a session does not show up. Look them over before you paste them.
      render: text
